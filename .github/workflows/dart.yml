name: dart
on:
  push:
    paths: ['packages/core/**', 'packages/hub_server/**', '.github/workflows/dart.yml']
  pull_request:
    paths: ['packages/core/**', 'packages/hub_server/**', '.github/workflows/dart.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [core, hub_server]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      # The Dart packages share a pub workspace with the Flutter apps, so resolution needs the Flutter SDK.
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        if: matrix.package == 'hub_server'
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
