name: flutter
on:
  push:
    paths: ['apps/pos_app/**', 'apps/admin_web/**', 'packages/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['apps/pos_app/**', 'apps/admin_web/**', 'packages/**', '.github/workflows/flutter.yml']
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [packages/ui_kit, apps/admin_web, apps/pos_app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  build-web:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.com/api/v1
        working-directory: apps/admin_web
      - uses: actions/upload-artifact@v4
        with: { name: admin_web, path: apps/admin_web/build/web }
  build-android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # Debug-signed APK. Release signing needs ANDROID_KEYSTORE_* secrets (see MORNING.md).
      - run: flutter build apk --debug
        working-directory: apps/pos_app
      - uses: actions/upload-artifact@v4
        with: { name: pos_app-apk, path: apps/pos_app/build/app/outputs/flutter-apk/*.apk }
