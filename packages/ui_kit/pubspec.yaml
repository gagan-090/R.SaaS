name: rsaas_ui_kit
description: '"House Plating" design system (STYLE.md): tokens, themes and components shared by pos_app and admin_web.'
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Liberation Sans (SIL OFL 1.1, fonts/LICENSE-LiberationSans.txt) has Arial's exact letter widths. It is the
  # fallback wherever Arial itself is missing: Flutter web (cannot use the computer's fonts) and Android.
  fonts:
    - family: LiberationSans
      fonts:
        - asset: fonts/LiberationSans-Regular.ttf
        - asset: fonts/LiberationSans-Italic.ttf
          style: italic
        - asset: fonts/LiberationSans-Bold.ttf
          weight: 700
        - asset: fonts/LiberationSans-BoldItalic.ttf
          weight: 700
          style: italic
