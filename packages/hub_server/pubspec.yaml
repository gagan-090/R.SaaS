name: rsaas_hub
description: Branch hub server — shelf HTTP + WebSocket, SQLite via drift, sync outbox, pairing, printing.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  rsaas_core: any
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  drift: ^2.20.0
  sqlite3: any
  http: ^1.2.0
  crypto: ^3.0.0
  cryptography: ^2.7.0
  pointycastle: ^4.0.0
  basic_utils: ^5.7.0
  pdf: ^3.11.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
